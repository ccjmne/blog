<extend template="base.shtml">
<head id="head">
  <style>:root { --column-width: min(90vw, 600px); }</style>
</head>
<main id="main">
  <h1 :text="$page.title"></h1>
  <ctx :if="$page.description.len().gt(0)">
    <div class="subtitle" :text="$page.description"></div>
  </ctx>
  <article :html="$page.content()"></article>
  <div class="hi">
    <article class="hero" :loop="$page.leaves()">
      <h2><a href="$loop.it.link()" :text="$loop.it.title"></a></h2>
      <ul class="infobar">
        <li><time :text="$loop.it.date.format('January 02, 2006')"></time></li>
        <li :text="$loop.it.description"></li>
      </ul>
    </article>
  </div>
</main>
